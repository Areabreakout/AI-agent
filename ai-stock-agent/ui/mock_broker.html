<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>模拟券商下单页（测试用）</title>
<style>
  body { font-family: "Microsoft YaHei", sans-serif; background: #10162a; color: #dbe2f0; display: flex; justify-content: center; padding-top: 60px; }
  .panel { background: #1a2130; border: 1px solid #2a3550; border-radius: 12px; padding: 28px; width: 340px; }
  h3 { margin: 0 0 6px; color: #f5b942; font-size: 16px; }
  .tip { font-size: 12px; color: #7b869e; margin-bottom: 18px; line-height: 1.6; }
  label { display: block; font-size: 12px; color: #7b869e; margin: 10px 0 4px; }
  input { width: 100%; box-sizing: border-box; padding: 9px 10px; border-radius: 6px; border: 1px solid #2a3550; background: #0d1220; color: #dbe2f0; font-size: 15px; }
  button { width: 48%; padding: 11px 0; margin-top: 18px; border: none; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; }
  #buy { background: #f04a5e; color: #fff; }
  #sell { background: #2ec27e; color: #06281a; margin-left: 4%; }
  #test-result { margin-top: 20px; padding: 10px; background: #0d1220; border-radius: 6px; font-size: 12.5px; color: #7b869e; word-break: break-all; }
</style>
</head>
<body>
<div class="panel">
  <h3>🧪 模拟券商委托下单页</h3>
  <div class="tip">这是本地测试页，用于验证 AI 能否正确定位输入框并点击买卖按钮。<b>不会产生任何真实交易。</b></div>
  <label>证券代码</label><input id="stockcode" placeholder="600519">
  <label>委托价格（元）</label><input id="price" placeholder="0.00">
  <label>委托数量（股）</label><input id="amount" placeholder="100">
  <div><button id="buy" onclick="record('buy')">买入</button><button id="sell" onclick="record('sell')">卖出</button></div>
  <div id="test-result">未操作</div>
</div>
<script>
function record(side) {
  var s = document.getElementById('stockcode').value;
  var p = document.getElementById('price').value;
  var a = document.getElementById('amount').value;
  document.getElementById('test-result').textContent =
    'CLICKED:' + side + '|' + s + '|' + p + '|' + a;
}
</script>
</body>
</html>
